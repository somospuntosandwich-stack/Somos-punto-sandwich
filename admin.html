<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punto Sandwich — Panel de pedidos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --ink:#15120c;
    --yellow:#f7b500;
    --yellow-deep:#c98600;
    --bg:#100d08;
    --surface:#1b160e;
    --surface-2:#262013;
    --text:#f8f4ea;
    --text-muted:rgba(248,244,234,.6);
    --line:rgba(255,255,255,.14);
    --ok:#25d366;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    min-height:100vh;
  }
  h1,h2,.display{
    font-family:'Fredoka',system-ui,sans-serif;
    font-weight:600;
    margin:0;
  }
  .wrap{max-width:880px;margin:0 auto;padding:20px 16px 60px;}

  header.top{
    position:sticky;top:0;z-index:10;
    background:var(--ink);
    border-bottom:3px solid var(--yellow);
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  header.top h1{font-size:1.1rem;color:#fff;}
  header.top .sub{font-size:.7rem;color:var(--yellow);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
  .refresh-note{
    font-size:.72rem;
    color:var(--text-muted);
  }

  /* ---- login gate ---- */
  .gate{
    max-width:340px;
    margin:80px auto;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:28px 24px;
    text-align:center;
  }
  .gate h2{font-size:1.3rem;margin-bottom:6px;}
  .gate p{color:var(--text-muted);font-size:.88rem;margin:0 0 18px;}
  .gate input{
    width:100%;
    background:rgba(255,255,255,.07);
    border:1.5px solid rgba(255,255,255,.16);
    border-radius:12px;
    color:#fff;
    font-size:1rem;
    padding:12px 14px;
    text-align:center;
    letter-spacing:.08em;
  }
  .gate button{
    width:100%;
    margin-top:12px;
    border:none;
    background:var(--yellow);
    color:var(--ink);
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:.95rem;
    padding:12px;
    border-radius:12px;
    cursor:pointer;
  }
  .gate .err{color:#ff9d8a;font-size:.8rem;margin-top:10px;min-height:1em;}

  /* ---- order list ---- */
  .filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:18px 0;
  }
  .filter-chip{
    background:var(--surface-2);
    border:1.5px solid var(--line);
    color:var(--text-muted);
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:.8rem;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .filter-chip.active{
    border-color:var(--yellow);
    background:rgba(247,181,0,.14);
    color:var(--yellow);
  }
  .empty-state{
    text-align:center;
    color:var(--text-muted);
    padding:60px 20px;
  }
  .order-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px 18px;
    margin-bottom:14px;
  }
  .order-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .order-num{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:1.15rem;
    color:var(--yellow);
  }
  .order-time{
    font-size:.76rem;
    color:var(--text-muted);
  }
  .order-customer{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    font-size:.86rem;
    color:var(--text);
    margin-bottom:10px;
    padding-bottom:10px;
    border-bottom:1px dashed var(--line);
  }
  .order-customer .name{font-weight:700;}
  .order-customer a{
    color:var(--yellow);
    text-decoration:none;
    font-weight:600;
  }
  .order-customer a:hover{text-decoration:underline;}
  .order-lines{
    font-size:.88rem;
    line-height:1.6;
    margin-bottom:8px;
  }
  .order-lines .oi-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
  }
  .order-lines .oi-qual{
    color:var(--text-muted);
    font-size:.78rem;
    padding-left:14px;
  }
  .order-meta{
    font-size:.8rem;
    color:var(--text-muted);
    border-top:1px dashed var(--line);
    padding-top:8px;
    margin-top:4px;
    line-height:1.6;
  }
  .order-meta strong{color:var(--text);}
  .order-total-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .order-total-row .amount{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:1.2rem;
    color:#fff;
  }
  .status-row{
    display:grid;
    gap:6px;
    margin-top:12px;
  }
  .status-row.cols-3{grid-template-columns:repeat(3,1fr);}
  .status-row.cols-4{grid-template-columns:repeat(4,1fr);}
  .status-btn{
    border:1.5px solid var(--line);
    background:var(--surface-2);
    color:var(--text-muted);
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:.72rem;
    padding:9px 4px;
    border-radius:10px;
    cursor:pointer;
    text-align:center;
    text-transform:uppercase;
    letter-spacing:.02em;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .status-btn[data-status="preparando"].current{border-color:#f7b500;background:rgba(247,181,0,.16);color:#f7b500;}
  .status-btn[data-status="listo"].current,
  .status-btn[data-status="listo_retiro"].current{border-color:#59c1ff;background:rgba(89,193,255,.16);color:#59c1ff;}
  .status-btn[data-status="enviando"].current{border-color:#c084fc;background:rgba(192,132,252,.16);color:#c084fc;}
  .status-btn[data-status="entregado"].current{border-color:var(--ok);background:rgba(37,211,102,.16);color:var(--ok);}
  .status-btn.done{
    border-color:rgba(37,211,102,.4);
    background:rgba(37,211,102,.06);
    color:rgba(37,211,102,.75);
  }
  .status-btn.locked{opacity:.4;}
  .status-btn.next{border-style:dashed;}
  .status-btn:disabled{cursor:default;}
  .status-btn.next:not(:disabled):hover{border-color:rgba(255,255,255,.35);color:#fff;}

  @media (max-width:420px){
    .status-row.cols-3,.status-row.cols-4{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Punto Sandwich</h1>
    <div class="sub">Panel de pedidos</div>
  </div>
  <div class="refresh-note" id="refreshNote"></div>
</header>

<div class="wrap">
  <div class="gate" id="gate">
    <h2>Ingresá la clave</h2>
    <p>Esta pantalla es solo para el local.</p>
    <input type="password" id="gateInput" placeholder="Clave del panel" autofocus>
    <button type="button" id="gateBtn">Entrar</button>
    <div class="err" id="gateErr"></div>
  </div>

  <div id="ordersView" hidden>
    <div class="filters" id="filters"></div>
    <div id="ordersList"></div>
  </div>
</div>

<script>
(function(){
  // Pickup and delivery orders follow different status flows, and an order
  // can only move to the very next step in its own flow — never backward,
  // never skipping one (the backend enforces the same rule; this just keeps
  // the screen from offering a move it would reject).
  var FLOWS = {
    pickup: ["preparando", "listo_retiro", "entregado"],
    delivery: ["preparando", "listo", "enviando", "entregado"],
  };
  var STATUSES = ["preparando", "listo", "listo_retiro", "enviando", "entregado"];
  var STATUS_LABEL = {
    preparando: "Preparando",
    listo: "Listo",
    listo_retiro: "Listo para retiro",
    enviando: "Llevando el pedido",
    entregado: "Entregado"
  };
  var POLL_MS = 12000;

  var gate = document.getElementById("gate");
  var gateInput = document.getElementById("gateInput");
  var gateBtn = document.getElementById("gateBtn");
  var gateErr = document.getElementById("gateErr");
  var ordersView = document.getElementById("ordersView");
  var ordersList = document.getElementById("ordersList");
  var filtersEl = document.getElementById("filters");
  var refreshNote = document.getElementById("refreshNote");

  var adminKey = sessionStorage.getItem("psAdminKey") || "";
  var activeFilter = "todos";
  var pollTimer = null;

  function fmt(n){
    return "$" + Math.round(n).toLocaleString("es-AR");
  }

  function authFetch(url, opts){
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { "Authorization": "Bearer " + adminKey });
    return fetch(url, opts);
  }

  function renderFilters(){
    var counts = { todos: 0 };
    STATUSES.forEach(function(s){ counts[s] = 0; });
    (window.__orders || []).forEach(function(o){
      counts.todos++;
      counts[o.status] = (counts[o.status] || 0) + 1;
    });
    var chips = [{ key: "todos", label: "Todos" }].concat(
      STATUSES.map(function(s){ return { key: s, label: STATUS_LABEL[s] }; })
    );
    filtersEl.innerHTML = chips.map(function(c){
      return '<button type="button" class="filter-chip' + (activeFilter === c.key ? " active" : "") + '" data-filter="' + c.key + '">' +
        c.label + ' (' + (counts[c.key] || 0) + ')' +
      '</button>';
    }).join("");
    filtersEl.querySelectorAll(".filter-chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        activeFilter = chip.getAttribute("data-filter");
        renderFilters();
        renderOrders();
      });
    });
  }

  function orderCardHtml(o){
    var itemsHtml = o.items.map(function(it){
      var addonTxt = it.addon ? " + " + it.addon : "";
      var row = '<div class="oi-row"><span>' + it.qty + 'x ' + it.name + addonTxt + '</span><span>' + fmt(it.sub) + '</span></div>';
      if (it.qualifier) row += '<div class="oi-qual">' + it.qualifier + '</div>';
      return row;
    }).join("");

    var metaLines = [];
    if (o.delivery_method === "delivery"){
      metaLines.push("<strong>Entrega:</strong> Delivery" + (o.barrio ? " — " + o.barrio : ""));
      metaLines.push("<strong>Dirección exacta:</strong> " + escapeHtml(o.address_notes || "-"));
      if (o.distance_km != null) metaLines.push("<strong>Distancia:</strong> " + o.distance_km + " km · <strong>Envío:</strong> " + fmt(o.delivery_fee || 0));
    } else {
      metaLines.push("<strong>Entrega:</strong> Retiro en el local");
    }
    if (o.notes) metaLines.push("<strong>Aclaraciones:</strong> " + escapeHtml(o.notes));

    var time = new Date(o.created_at).toLocaleString("es-AR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });

    var flow = FLOWS[o.delivery_method] || FLOWS.pickup;
    var currentIndex = flow.indexOf(o.status);
    var statusButtons = flow.map(function(s, i){
      var isCurrent = i === currentIndex;
      var isDone = i < currentIndex;
      var isNext = i === currentIndex + 1;
      var cls = "status-btn";
      if (isCurrent) cls += " current";
      else if (isDone) cls += " done";
      else if (isNext) cls += " next";
      else cls += " locked";
      var clickable = isNext;
      var label = (isDone ? "✓ " : "") + STATUS_LABEL[s];
      return '<button type="button" class="' + cls + '" data-status="' + s + '" data-id="' + o.id + '"' + (clickable ? "" : " disabled") + '>' + label + '</button>';
    }).join("");

    var phoneHref = (o.customer_phone || "").replace(/[^\d+]/g, "");
    var customerHtml =
      '<div class="order-customer">' +
        '<span class="name">' + escapeHtml(o.customer_name || "(sin nombre)") + '</span>' +
        (phoneHref ? '<a href="tel:' + phoneHref + '">📞 ' + escapeHtml(o.customer_phone) + '</a>' : '<span>(sin teléfono)</span>') +
      '</div>';

    return (
      '<div class="order-card" data-order-id="' + o.id + '">' +
        '<div class="order-head">' +
          '<div class="order-num">Pedido N° ' + o.id + '</div>' +
          '<div class="order-time">' + time + '</div>' +
        '</div>' +
        customerHtml +
        '<div class="order-lines">' + itemsHtml + '</div>' +
        '<div class="order-meta">' + metaLines.join("<br>") + '</div>' +
        '<div class="order-total-row"><span>Total</span><span class="amount">' + fmt(o.total) + '</span></div>' +
        '<div class="status-row cols-' + flow.length + '">' + statusButtons + '</div>' +
      '</div>'
    );
  }

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderOrders(){
    var all = window.__orders || [];
    var filtered = activeFilter === "todos" ? all : all.filter(function(o){ return o.status === activeFilter; });
    if (filtered.length === 0){
      ordersList.innerHTML = '<div class="empty-state">No hay pedidos ' + (activeFilter === "todos" ? "todavía" : "en este estado") + '.</div>';
      return;
    }
    ordersList.innerHTML = filtered.map(orderCardHtml).join("");
    ordersList.querySelectorAll(".status-btn:not(:disabled)").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        var status = btn.getAttribute("data-status");
        updateStatus(id, status);
      });
    });
  }

  function updateStatus(id, status){
    authFetch("/api/orders/" + id, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: status })
    }).then(function(resp){
      if (!resp.ok) throw new Error("update failed");
      return loadOrders();
    }).catch(function(){
      alert("No se pudo actualizar el estado. Puede que otra persona ya lo haya cambiado — se va a refrescar la pantalla.");
      loadOrders();
    });
  }

  function loadOrders(){
    return authFetch("/api/orders").then(function(resp){
      if (resp.status === 401){
        sessionStorage.removeItem("psAdminKey");
        showGate("Clave incorrecta o vencida.");
        throw new Error("unauthorized");
      }
      return resp.json();
    }).then(function(data){
      window.__orders = data.orders || [];
      renderFilters();
      renderOrders();
      refreshNote.textContent = "Actualizado " + new Date().toLocaleTimeString("es-AR", { hour:"2-digit", minute:"2-digit" });
    });
  }

  function showGate(err){
    gate.hidden = false;
    ordersView.hidden = true;
    gateErr.textContent = err || "";
    gateInput.focus();
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function showOrders(){
    gate.hidden = true;
    ordersView.hidden = false;
    loadOrders();
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(loadOrders, POLL_MS);
  }

  function tryKey(key){
    adminKey = key;
    return authFetch("/api/orders").then(function(resp){
      if (resp.status === 401){
        gateErr.textContent = "Clave incorrecta.";
        return false;
      }
      return resp.json().then(function(data){
        sessionStorage.setItem("psAdminKey", key);
        window.__orders = data.orders || [];
        showOrders();
        return true;
      });
    }).catch(function(){
      gateErr.textContent = "No se pudo conectar. Probá de nuevo.";
      return false;
    });
  }

  gateBtn.addEventListener("click", function(){
    var key = gateInput.value.trim();
    if (!key){ gateErr.textContent = "Ingresá la clave."; return; }
    gateErr.textContent = "";
    tryKey(key);
  });
  gateInput.addEventListener("keydown", function(e){
    if (e.key === "Enter") gateBtn.click();
  });

  if (adminKey){
    tryKey(adminKey);
  }
})();
</script>

</body>
</html>
